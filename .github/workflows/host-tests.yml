# Build and run the host test suites, which need nothing but a C++ compiler
# and CMake: tests/spec checks DDSI-RTPS statements by spec section
# (TC-<AREA>-<section>-<seq>), tests/host checks the portable and port code
# that has no spec section of its own. The sanitizers job runs the same suites,
# plus the fuzz corpus replays, under AddressSanitizer and UndefinedBehaviorSanitizer
# (cmake/rosette_sanitizers.cmake); an undefined-behavior finding fails the test.
# The warnings job builds them with GCC and Clang, optimized, with every warning
# of cmake/rosette_warnings.cmake an error.
name: host-tests

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request cancels that pull request's run in progress;
# runs on main and scheduled runs each get their own group and always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Skip the build jobs when a pull request changes documentation only
  # (tools/ci/classify_changed_paths.py). Pushes to main always build.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: classify
        run: python3 tools/ci/classify_changed_paths.py "${{ github.event_name }}" >> "$GITHUB_OUTPUT"

  host-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        suite: [spec, host]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S tests/${{ matrix.suite }} -B build/tests-${{ matrix.suite }}

      - name: Build
        run: cmake --build build/tests-${{ matrix.suite }} -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build/tests-${{ matrix.suite }} --output-on-failure

  sanitizers:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        suite: [spec, host]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S tests/${{ matrix.suite }} -B build/tests-${{ matrix.suite }}-san
          -DROSETTE_SANITIZE=ON
          ${{ matrix.suite == 'spec' && '-DROSETTE_SPEC_ENABLE_FUZZ=ON' || '' }}

      - name: Build
        run: cmake --build build/tests-${{ matrix.suite }}-san -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build/tests-${{ matrix.suite }}-san --output-on-failure

  warnings:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [spec, host]
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S tests/${{ matrix.suite }} -B build/tests-${{ matrix.suite }}-warn
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -DROSETTE_WERROR=ON

      - name: Build
        run: cmake --build build/tests-${{ matrix.suite }}-warn -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build/tests-${{ matrix.suite }}-warn --output-on-failure

  # The check branch protection requires: every job passed, or was skipped
  # because the change is documentation only.
  result:
    name: host-tests result
    if: always()
    needs: [changes, host-tests, sanitizers, warnings]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to pass or be skipped
        run: >
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
