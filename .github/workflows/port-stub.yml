# Build the portable core on the stub port (tests/port_stub): a bare Cortex-M0+
# with newlib and no Pico SDK, RTOS, or POSIX. A portable file that reaches a
# chip SDK or host OS fails to link here.
name: port-stub

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request cancels that pull request's run in progress;
# runs on main and scheduled runs each get their own group and always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Skip the build jobs when a pull request changes documentation only
  # (tools/ci/classify_changed_paths.py). Pushes to main always build.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: classify
        run: python3 tools/ci/classify_changed_paths.py "${{ github.event_name }}" >> "$GITHUB_OUTPUT"

  port-stub:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # stub: the compile-only OS layer; baremetal: the real superloop OS
        # layer, which must need nothing from a chip but its sync hooks.
        os: [stub, baremetal]
    steps:
      - uses: actions/checkout@v4

      - name: Install the Arm bare-metal toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Configure
        run: |
          cmake -S tests/port_stub -B build-port-stub \
                -DCMAKE_TOOLCHAIN_FILE="$PWD/tests/port_stub/arm-none-eabi.cmake" \
                -DROSETTE_OS=${{ matrix.os }} \
                -DROSETTE_WERROR=ON

      - name: Build and link
        run: cmake --build build-port-stub -j "$(nproc)"

      # Log calls above the default WARN level are compiled out of the build
      # above, so their printf formats are only checked here.
      - name: Build with every log call compiled in
        run: |
          cmake -S tests/port_stub -B build-port-stub-trace \
                -DCMAKE_TOOLCHAIN_FILE="$PWD/tests/port_stub/arm-none-eabi.cmake" \
                -DROSETTE_OS=${{ matrix.os }} \
                -DROSETTE_WERROR=ON \
                -DROSETTE_RTPS_LOG_LEVEL=5
          cmake --build build-port-stub-trace -j "$(nproc)"

  # The check branch protection requires: every job passed, or was skipped
  # because the change is documentation only.
  result:
    name: port-stub result
    if: always()
    needs: [changes, port-stub]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to pass or be skipped
        run: >
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
